name: Reproduce season evaluation
on: workflow_dispatch
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-lock.txt && pip install -e . --no-deps
      - run: nba-predict download --years 2023 2024 2025 2026
      - run: nba-predict train --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: season-evaluation
          path: |
            artifacts/
            data/raw/manifest.json
